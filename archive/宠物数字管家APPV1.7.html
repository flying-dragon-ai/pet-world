<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠物数字管家 V1.8 - 3D宠物世界版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<style>
:root{--blue:#4A90D9;--blue-d:#3A7BD5;--ink:#2D2D2D;--sub:#8A8A8A;--danger:#F05B5B;--ok:#3BB786;--warn:#F5A623}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'PingFang SC','Noto Sans SC','HarmonyOS Sans SC',Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,#EAF2FB 0%,#F5F0EB 45%,#E9F0FA 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
.bg-blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none;animation:blobFloat 14s ease-in-out infinite}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.08)}}
.phone{width:392px;height:850px;border-radius:52px;position:relative;z-index:1;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);box-shadow:0 34px 90px rgba(58,123,213,.28),inset 0 0 0 1px rgba(255,255,255,.65);overflow:hidden}
@media(max-width:500px){.phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}}
.statusbar{height:46px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 4px;font-size:13px;font-weight:600;position:relative;z-index:6}
.page{position:absolute;top:46px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;display:none;padding-bottom:100px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.on{display:block;animation:pageIn .3s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page.nopad{padding-bottom:0}
.glass{background:rgba(255,255,255,.42);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 32px rgba(58,123,213,.09)}
.card{background:rgba(255,255,255,.42);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.6);border-radius:22px;box-shadow:0 8px 32px rgba(58,123,213,.09)}
.chov{transition:all .3s cubic-bezier(.4,0,.2,1)}
.chov:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(58,123,213,.16)}
.chov:active{transform:scale(.97)}
.press:active{transform:scale(.94)}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-s{width:16px;height:16px}
.icon-l{width:26px;height:26px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:82px;z-index:16;display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;background:rgba(255,255,255,.55);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border-top:1px solid rgba(255,255,255,.7)}
.tabbar.hidden{display:none}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#9AA6B5;background:none;border:none;cursor:pointer;padding:0 10px;transition:color .25s}
.tbtn.act{color:var(--blue-d);font-weight:700}
.ai-center{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#6FA6F0,#3A7BD5);display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-26px;box-shadow:0 12px 26px rgba(58,123,213,.5),0 0 0 6px rgba(255,255,255,.9);animation:breath 3s ease-in-out infinite}
@keyframes breath{0%,100%{box-shadow:0 12px 26px rgba(58,123,213,.5),0 0 0 6px rgba(255,255,255,.9)}50%{box-shadow:0 12px 34px rgba(58,123,213,.75),0 0 0 9px rgba(120,168,240,.35)}}
.dot-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.input{width:100%;border:none;outline:none;background:rgba(255,255,255,.55);border-radius:14px;padding:13px 16px;font-size:14px;color:var(--ink);transition:box-shadow .3s}
.input:focus{box-shadow:0 0 0 3px rgba(74,144,217,.22)}
.input::placeholder{color:#A8B2BE}
.btn{border:none;cursor:pointer;border-radius:14px;font-size:14px;font-weight:600;padding:12px 0;width:100%;transition:all .25s;color:#fff;background:linear-gradient(135deg,#5B8DEF,#3A7BD5);box-shadow:0 8px 20px rgba(58,123,213,.32);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.scene-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.65);border:1px solid rgba(58,123,213,.18);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .25s;max-width:100%}
.scene-pill:active{transform:scale(.96)}
.scene-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn-ghost{background:rgba(255,255,255,.55);color:var(--blue-d);border:1px solid rgba(74,144,217,.35);box-shadow:none}
.btn-sm{padding:7px 14px;width:auto;font-size:12px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;font-size:11.5px;background:rgba(74,144,217,.12);color:var(--blue-d);font-weight:600}
.sec-t{font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.avatar{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#DCE9FA,#F0E6D8)}
.imgfb{width:100%;height:100%;border-radius:inherit;background:linear-gradient(135deg,#C9DCF5 0%,#EAD9C2 100%);display:flex;align-items:center;justify-content:center}
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(45,45,45,.88);color:#fff;padding:10px 20px;border-radius:14px;font-size:13px;z-index:99;opacity:0;transition:all .3s;pointer-events:none;max-width:80%;text-align:center;backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mask{position:absolute;inset:0;background:rgba(45,55,80,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px)}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:rgba(255,255,255,.92);backdrop-filter:blur(30px);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.32,.72,.35,1);max-height:78%;display:flex;flex-direction:column;padding:8px 18px 26px}
.sheet.show{transform:translateY(0)}
.sheet-h{padding:10px 4px 14px;text-align:center;font-weight:800;font-size:15px;flex:none;position:relative}
.sheet-b{overflow-y:auto;scrollbar-width:none}
.sheet-b::-webkit-scrollbar{display:none}
.modal-wrap{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:28px}
.modal-wrap.show{display:flex}
.modal{background:rgba(255,255,255,.95);backdrop-filter:blur(30px);border-radius:24px;padding:22px;width:100%;max-width:300px;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.wline{stroke-dasharray:800;stroke-dashoffset:800;animation:drawLine 1.8s ease .3s forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.wdot{opacity:0;animation:dotIn .4s ease forwards}
@keyframes dotIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.fadeUp{animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.statbar{height:7px;border-radius:4px;background:rgba(58,123,213,.12);overflow:hidden;flex:1}
.statfill{height:100%;border-radius:4px;background:linear-gradient(90deg,#6FA6F0,#3A7BD5);transition:width .6s cubic-bezier(.4,0,.2,1)}
.gp-bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.tail{transform-origin:10% 90%;animation:tailWag 1.6s ease-in-out infinite}
@keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
.floatUp{position:absolute;font-size:22px;animation:floatUp 1.1s ease forwards;pointer-events:none;z-index:5}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-70px) scale(1.25)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8FA8C9;margin:0 2px;animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-5px);opacity:1}}
.msg-ai{animation:fadeUp .3s ease}
.emg{background:linear-gradient(135deg,rgba(240,91,91,.12),rgba(240,91,91,.06));border:1.5px solid rgba(240,91,91,.55);border-radius:16px;padding:12px 14px;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
.record-item{animation:fadeUp .35s ease}
.rTab{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.55);color:#8A99AB;cursor:pointer;white-space:nowrap;transition:all .25s;border:none}
.rTab.act{background:linear-gradient(135deg,#5B8DEF,#3A7BD5);color:#fff;box-shadow:0 5px 14px rgba(58,123,213,.35)}
.tog{width:46px;height:27px;border-radius:14px;background:#D5DEE9;position:relative;transition:background .3s;cursor:pointer;flex:none;border:none}
.tog.on{background:linear-gradient(135deg,#5B8DEF,#3A7BD5)}
.tog::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2.5px;left:2.5px;transition:left .3s;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tog.on::after{left:21px}
.skuBtn{padding:8px 14px;border-radius:12px;border:1.5px solid rgba(58,123,213,.2);background:rgba(255,255,255,.6);font-size:12.5px;font-weight:600;cursor:pointer;position:relative;transition:all .2s}
.skuBtn.act{border-color:var(--blue-d);background:rgba(74,144,217,.12);color:var(--blue-d)}
.skuBtn.off{opacity:.4;cursor:not-allowed;background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.06)}
.skuBtn .sleft{position:absolute;top:-7px;right:-6px;background:var(--danger);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.ordbadge{font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700}
.offlineBan{position:absolute;top:46px;left:10px;right:10px;z-index:30;background:rgba(245,166,35,.94);color:#fff;font-size:12px;font-weight:600;border-radius:12px;padding:9px 14px;display:none;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(245,166,35,.4)}
.offlineBan.show{display:flex;animation:fadeUp .3s ease}
.onb{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,#EAF2FB,#F5F0EB);display:none;flex-direction:column;padding:60px 34px 30px}
.onb.show{display:flex}
.onb-dot{width:8px;height:8px;border-radius:50%;background:rgba(58,123,213,.25);transition:all .3s}
.onb-dot.act{width:24px;background:var(--blue-d)}
.livepet{animation:petWalk 9s ease-in-out infinite}
@keyframes petWalk{0%,100%{transform:translateX(-42px)}50%{transform:translateX(42px)}}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hearts span{position:absolute;font-size:18px;animation:hUp 1.2s ease forwards}
@keyframes hUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-60px) scale(1.3) rotate(12deg)}}
.missRun{animation:missRun 1.2s cubic-bezier(.34,1.4,.64,1) forwards}
@keyframes missRun{from{transform:translateX(160px) scale(.5);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
.calCell{width:40px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;background:rgba(255,255,255,.5);transition:all .25s}
.calCell.done{background:linear-gradient(135deg,#5B8DEF,#3A7BD5);color:#fff}
.calCell.today{outline:2px solid rgba(74,144,217,.6)}
.rt-list li{padding-left:18px;position:relative;margin-bottom:7px;font-size:13px;line-height:1.55}
.rt-list li::before{content:'';position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
/* ===== V1.5 新增样式 ===== */
.scene-pill.act{background:linear-gradient(135deg,#5B8DEF,#3A7BD5);color:#fff;border-color:transparent}
.scene-pill.act span{color:#fff}
#micBtn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(74,144,217,.1);color:var(--blue-d);transition:all .25s}
#micBtn.rec{background:rgba(240,91,91,.15);color:var(--danger);animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,91,91,.35)}50%{box-shadow:0 0 0 7px rgba(240,91,91,0)}}
.vplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;pointer-events:none}
.vdur{position:absolute;bottom:8px;right:10px;font-size:9px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;pointer-events:none}
.abn{display:flex;align-items:center;gap:9px;padding:11px 13px;margin-bottom:8px;background:linear-gradient(135deg,rgba(240,91,91,.1),rgba(240,91,91,.04));border:1.5px solid rgba(240,91,91,.45);border-radius:16px;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
.qTxt{font-size:13px;line-height:1.7;white-space:pre-wrap}
.subhdr{position:sticky;top:0;z-index:10;padding:12px 18px;display:flex;align-items:center;gap:10px;background:rgba(245,240,235,.82);backdrop-filter:blur(20px)}
/* ===== V1.4 特斯拉风首页 + 直播 ===== */
.hero14{position:relative;border-radius:24px;background:linear-gradient(150deg,#1B2A4A 0%,#22355C 45%,#2E4A7A 100%);color:#fff;padding:22px 18px 0;margin-bottom:14px;overflow:hidden;box-shadow:0 18px 44px rgba(20,35,70,.35)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.hero-pet{width:118px;height:118px;flex:none;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.16),rgba(255,255,255,.04));border-radius:50%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.hero-cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;transition:transform .2s,box-shadow .2s}
.hero-cta:active{transform:scale(.96)}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:16px -18px 0;border-top:1px solid rgba(255,255,255,.14);position:relative}
.hero-stats>div{padding:11px 4px;text-align:center;position:relative}
.hero-stats>div+div::before{content:'';position:absolute;left:0;top:24%;height:52%;width:1px;background:rgba(255,255,255,.14)}
.hs-n{font-size:19px;font-weight:300;letter-spacing:.4px}
.hs-n b{font-size:10px;font-weight:700;margin-left:1px}
.hs-l{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:1px;margin-top:1px}
.tile{background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:15px;cursor:pointer;transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(58,123,213,.14)}
.tile .t-sub{font-size:10.5px;color:var(--sub);margin-top:3px}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr)}
.stat-strip>div{padding:13px 6px;text-align:center;position:relative}
.stat-strip>div+div::before{content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:rgba(45,45,45,.08)}
.bignum{font-size:25px;font-weight:300;letter-spacing:.4px;color:var(--ink)}
.bignum b{font-size:11px;font-weight:700;margin-left:2px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#FF4D4F;animation:ty 1s infinite;flex:none;display:inline-block}
@keyframes lvPulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes lvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.live-fab{position:absolute;z-index:34;width:150px;border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(15,25,55,.5);background:#101828;touch-action:none}
.live-fab .lv-head{display:flex;align-items:center;gap:5px;padding:6px 8px;cursor:grab;background:rgba(255,255,255,.07);touch-action:none}
.live-fab .lv-head:active{cursor:grabbing}
.live-fab .lv-stage{position:relative;height:102px;background:#0B1220;overflow:hidden;cursor:pointer}
.live-fab .lv-foot{display:flex;align-items:center;gap:6px;padding:5px 8px;background:rgba(255,255,255,.05)}
.live-fab.mini{width:142px;border-radius:999px;box-shadow:0 10px 26px rgba(15,25,55,.5)}
.live-fab.mini .lv-head,.live-fab.mini .lv-foot,.live-fab.mini .lv-stage{display:none}
.lv-btn{width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#fff}
.lv-btn:active{background:rgba(255,255,255,.34)}
.lv-buffer{position:absolute;inset:0;background:rgba(6,12,28,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;z-index:3}
.lv-c{font-size:9px;color:#fff;background:rgba(0,0,0,.45);border-radius:8px;padding:2px 7px;width:fit-content;max-width:100%;animation:fadeUp .3s ease}
/* ===== V1.7 人宠世界 ===== */
.world-load{position:absolute;inset:0;z-index:70;background:linear-gradient(160deg,#EAF2FB,#F5F0EB 55%,#E4F0EA);display:none;flex-direction:column;align-items:center;justify-content:center}
.world-load.show{display:flex}
@keyframes wlBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wl-bar{width:210px;height:9px;border-radius:5px;background:rgba(58,123,213,.14);overflow:hidden;margin-top:18px;box-shadow:inset 0 1px 3px rgba(58,123,213,.15)}
.wl-fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#6FA6F0,#3A7BD5);transition:width .12s linear;box-shadow:0 0 10px rgba(58,123,213,.45)}
.crg{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:5px;outline:none;background:linear-gradient(90deg,#F5A623,#8B5CF6);cursor:grab}
.crg::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #8B5CF6;box-shadow:0 3px 10px rgba(139,92,246,.45);cursor:grab}
.crg::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #8B5CF6;box-shadow:0 3px 10px rgba(139,92,246,.45);cursor:grab}
.crg:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.1)}
.wstat{margin-bottom:9px}
.wstat .wt{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-bottom:3px}
.wstat .wt b{color:var(--ink);font-size:11px}
.wmedal{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:16px;margin-bottom:8px;border:1.5px solid rgba(58,123,213,.14);background:rgba(255,255,255,.5)}
.wmedal.on{border-color:rgba(217,160,60,.5);background:linear-gradient(135deg,rgba(245,208,97,.14),rgba(217,160,60,.05))}
.wmedal .mi{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:19px}
.wtab{flex:1;padding:8px 0;border-radius:12px;border:none;cursor:pointer;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.55);color:#8A99AB;transition:all .25s}
.wtab.act{background:linear-gradient(135deg,#8B5CF6,#6D4AD6);color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.35)}

/* ===== V1.8 3D 宠物世界（横屏舞台） ===== */
#w3dStage{position:fixed;inset:0;z-index:70;display:none;background:#12203D;overflow:hidden}
#w3dStage.show{display:block}
#w3dBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center}
#w3dGL{position:absolute;inset:0}
#w3dGL canvas{display:block}
#w3dHudTop{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
#w3dBack{pointer-events:auto;border:none;cursor:pointer;background:rgba(10,20,40,.45);color:#fff;font-size:13px;font-weight:700;padding:8px 15px;border-radius:999px;backdrop-filter:blur(8px)}
#w3dStats{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-width:0}
.w3d-mini{display:flex;align-items:center;gap:4px;background:rgba(10,20,40,.42);border-radius:999px;padding:4px 9px;color:#fff;font-size:10px;backdrop-filter:blur(8px)}
.w3d-mini .w3d-mbar{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.w3d-mini .w3d-mbar i{display:block;height:100%;border-radius:3px}
.w3d-mini b{font-size:10px;min-width:15px;text-align:right}
#w3dCoin{pointer-events:auto;background:rgba(245,208,97,.92);color:#6B4E00;font-weight:800;font-size:11px;padding:5px 11px;border-radius:999px;white-space:nowrap}
#w3dHudBottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:12px 14px 16px}
.w3d-act{border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;width:76px;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(10,25,60,.3);font-size:11px;font-weight:800;color:#2D3A55;transition:transform .15s,opacity .2s}
.w3d-act:active{transform:scale(.93)}
.w3d-act span{font-size:19px}
.w3d-act.cd{opacity:.45}
#w3dToast{position:absolute;top:54px;left:50%;transform:translateX(-50%) translateY(-14px);background:rgba(20,28,48,.88);color:#fff;padding:9px 18px;border-radius:14px;font-size:12.5px;z-index:8;opacity:0;transition:all .3s;pointer-events:none;max-width:72%;text-align:center}
#w3dToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#w3dBubble{position:absolute;z-index:6;display:none;transform:translate(-50%,-100%);background:rgba(255,255,255,.95);color:#37415C;font-size:11px;font-weight:700;padding:7px 12px;border-radius:14px;box-shadow:0 6px 16px rgba(10,25,60,.28);white-space:nowrap;pointer-events:none}
#w3dBubble::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(255,255,255,.95);border-bottom:none}
#w3dTip{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);z-index:6;display:none;background:rgba(10,20,40,.55);color:#fff;font-size:11px;padding:6px 14px;border-radius:999px;backdrop-filter:blur(6px);white-space:nowrap}
.w3d-fx-i{position:absolute;z-index:7;font-size:22px;animation:w3dFloat 1.1s ease forwards;pointer-events:none;transform:translate(-50%,-50%)}
@keyframes w3dFloat{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-64px}}
#w3dFall{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(160deg,#1B2A4A,#22355C);color:#fff;text-align:center;padding:30px}
</style>

  if(RISK_KW.some(k=>q.includes(k))){

    CH.msgs.push({r:'ai',id:uid(),t:'抱歉，涉及药品剂量的问题无法直接回答。药物使用剂量必须遵兽医处方，'+(ctxPet()?'请携带'+curPet().name+'的档案记录线下就医。':'请线下就医。'),ts:Date.now()});
    if(!CH.sess.title)CH.sess.title=q.slice(0,15);

function streamReply(q,isEmg){
  const m={r:'ai',id:uid(),t:'',ts:Date.now()};
  CH.msgs.push(m);
  const box=$('chatMsgs');
  box.insertAdjacentHTML('beforeend','<div id="streaming" style="display:flex;gap:8px;margin-bottom:12px"><div style="width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#8FB6EE,#3A7BD5);display:flex;align-items:center;justify-content:center;flex:none"><svg class="icon icon-s" style="color:#fff"><use href="#i-spark"/></svg></div><div style="max-width:82%"><div id="stTxt" style="background:rgba(255,255,255,.75);padding:10px 13px;border-radius:4px 16px 16px 16px;font-size:13px;line-height:1.65" class="qTxt"></div><div style="display:flex;justify-content:center;margin-top:6px"><button class="btn btn-sm btn-ghost" id="stopBtn" onclick="stopGen()"><svg class="icon icon-s"><use href="#i-stop"/></svg> 停止生成</button></div></div></div>');
  box.scrollTop=box.scrollHeight;
  $('sendBtn').disabled=true;
  const full=aiReply(q);
  let i=0;
  const abortAt=isEmg?Math.floor(full.length*0.18):-1;
  CH.stream=setInterval(()=>{
    i+=1+Math.floor(Math.random()*2);
    const st=$('stTxt');if(!st){clearInterval(CH.stream);return}
    if(abortAt>0&&i>=abortAt){
      clearInterval(CH.stream);CH.stream=null;
      m.t='（内容已中止）';m.stop=false;
      showEmg();
      finishStream();
      return;
    }
    if(i>=full.length){
      clearInterval(CH.stream);CH.stream=null;
      m.t=full;finishStream();
      if(CH.scene==='shop'&&!isEmg){const picks=shopPicks();if(picks.length){CH.msgs.push({r:'cards',items:picks});saveSess();renderMsgs()}}
      return;
    }
    st.innerHTML=esc(full.slice(0,i))+'<span style="opacity:.4">▍</span>';
    box.scrollTop=box.scrollHeight;
  },26);
}
function finishStream(){
  const el=$('streaming');if(el)el.remove();
  $('sendBtn').disabled=false;
  saveSess();renderMsgs();
}
function stopGen(){
  if(!CH.stream)return;
  clearInterval(CH.stream);CH.stream=null;
  const m=CH.msgs[CH.msgs.length-1];
  const st=$('stTxt');
  if(st&&st.textContent){m.t=esc2keep(st.textContent.replace('▍',''));}
  else m.t='（已停止）';
  m.stop=true;
  finishStream();
  toast('已停止生成：已输出内容保留，不扣减重新生成次数');
}

function startReply(i,to){

  setTimeout(()=>{const inp=$('cmtIn');if(inp)inp.focus()},80);
}
function cancelReply(){window._replyCmt=null;openPost(window._pid)}
function addCmt(){
  const v=$('cmtIn').value.trim();if(!v){toast('评论不能为空');return}
  const po=S.posts.find(p=>p.id===window._pid);
  const rc=window._replyCmt;
  if(rc&&rc.pid===window._pid){
    const c=po.cmts[rc.i];
    if(!c||c.del){window._replyCmt=null;openPost(window._pid);toast('原评论已删除');return}
    c.replies=c.replies||[];
    c.replies.push({u:S.user.nick,to:rc.to,t2:v,ts:Date.now()});

  }
}

  openSheet('修正记录','<div style="font-size:12px;color:var(--sub);margin-bottom:10px">当前值：'+d.v+'（'+(d.k==='weight'?'kg':d.k==='water'?'ml':'档')+'）</div><input class="input" id="fxIn" inputmode="decimal" placeholder="输入修正后的值" style="margin-bottom:12px"><button class="btn" onclick="doFix('+ts+')">确认修正</button>');

function doFix(ts){
  const d=S.daily.find(x=>x.ts===ts);const v=+$('fxIn').value;
  if(!v){toast('请输入数值');return}
  d.orig=d.v;d.v=v;d.fixed=true;d.by=S.user.nick;
  save();closeSheet();renderHealth();toast('已修正（原值 '+d.orig+'），并重新触发异常判定');
}

function pbClockStr(seg,t){const tot=seg.h*3600+seg.m*60+Math.floor(t);const f=x=>String(x).padStart(2,'0');return f(Math.floor(tot/3600))+':'+f(Math.floor(tot%3600/60))+':'+f(tot%60)}

function pbTick(){
  const pb=window._pb;if(!pb||!pb.playing)return;
  const total=pb.seg.dur*60;
  pb.t+=total/40*pb.sp;
  if(pb.t>=total){pb.t=total;pb.playing=false;clearInterval(pb.tm);const b=$('pbPlay');if(b)b.innerHTML='<svg class="icon icon-s" style="vertical-align:-3px"><use href="#i-play"/></svg> 重播'}
  const bar=$('pbBar');if(bar)bar.style.width=(pb.t/total*100)+'%';
  const left=$('pbLeft');if(left)left.textContent=fmtMMSS(total-pb.t);
  const clock=$('pbClock');if(clock)clock.textContent=pbClockStr(pb.seg,pb.t);
}
function pbToggle(){
  const pb=window._pb;if(!pb)return;
  const b=$('pbPlay');
  if(pb.playing){pb.playing=false;if(b)b.innerHTML='<svg class="icon icon-s" style="vertical-align:-3px"><use href="#i-play"/></svg> 播放'}
  else{if(pb.t>=pb.seg.dur*60)pb.t=0;pb.playing=true;if(pb.tm)clearInterval(pb.tm);pb.tm=setInterval(pbTick,300);if(b)b.innerHTML='<svg class="icon icon-s" style="vertical-align:-3px"><use href="#i-stop"/></svg> 暂停'}
}

function ptz(dir){
  const sc=$('liveScene');if(!sc)return;
  const st=sc.style.transform||'translate(0,0)';
  let m=st.match(/translate\((-?[\d.]+)px,\s*(-?[\d.]+)px\)/);let x=0,y=0;
  if(m){x=+m[1];y=+m[2]}
  if(dir==='up')y-=10;if(dir==='down')y+=10;if(dir==='left')x-=10;if(dir==='right')x+=10;if(dir==='c'){x=0;y=0}
  sc.style.transform='translate('+Math.max(-40,Math.min(40,x))+'px,'+Math.max(-30,Math.min(30,y))+'px)';
}

  if(ex)ex.qty++;
  else S.cart.push({pid:pr.id,sku:pr.skus[curSku],qty:1,sel:true});
  save();
  if(mode===2){go('cart')}
  else{toast('已加入购物车');renderMallDetail()}
}

  const c=S.cart.find(x=>x.pid===pid&&x.sku===sku);
  c.qty+=d;if(c.qty<1)c.qty=1;if(c.qty>99)c.qty=99;
  save();renderCart();
}
function cartDel(pid,sku){S.cart=S.cart.filter(x=>!(x.pid===pid&&x.sku===sku));save();renderCart();toast('已移除')}
function checkout(){
  if(!needNet())return;
  const sel=S.cart.filter(c=>c.sel);
  const bad=sel.find(c=>(S.products.find(p=>p.id===c.pid)||{stock:0}).stock<=0);
  if(bad){const bp=S.products.find(p=>p.id===bad.pid);toast('['+bp.name+'] 库存不足');bad.sel=false;save();renderCart();return}
  const items=sel.map(c=>({pid:c.pid,name:S.products.find(p=>p.id===c.pid).name,sku:c.sku,price:S.products.find(p=>p.id===c.pid).price,qty:c.qty,img:S.products.find(p=>p.id===c.pid).img}));
  const amount=items.reduce((s,i)=>s+i.price*i.qty,0);
  window._ck={items,amount};
  openSheet('确认订单',
  '<div class="card" style="padding:11px 13px;margin-bottom:12px;display:flex;gap:9px;align-items:center"><svg class="icon" style="color:var(--blue-d)"><use href="#i-pin"/></svg><div style="flex:1;font-size:12.5px;font-weight:700">北京市朝阳区 幸福家园 3-2-501</div><span style="font-size:10.5px;color:var(--blue-d)">修改</span></div>'+

  '<input class="input" id="ptsIn" inputmode="numeric" placeholder="输入抵扣积分（≤'+Math.min(S.points,Math.floor(amount/2))+'，上限为应付50%）" style="margin-bottom:8px" oninput="ckPts()">'+
  '<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:900"><span>应付</span><span style="color:var(--danger)">¥<span id="ckAmt">'+amount+'</span></span></div>'+
  '<button class="btn" style="margin-top:14px" onclick="submitOrder()">模拟支付（15分钟倒计时）</button>');

/* 拖拽（支持缩放后的坐标换算） */
let lvDrag={on:false,moved:false,sx:0,sy:0,ox:0,oy:0};
function lvDragStart(e){
  if(live.mini)return;
  if(e.target.closest&&e.target.closest('.lv-btn'))return;
  lvDrag.on=true;lvDrag.moved=false;
  lvDrag.sx=e.clientX;lvDrag.sy=e.clientY;
  const el=$('liveFab');
  lvDrag.ox=el.offsetLeft;lvDrag.oy=el.offsetTop;
}
function lvDragMove(e){
  if(!lvDrag.on)return;
  const sc=window.__phoneScale||1;
  const dx=(e.clientX-lvDrag.sx)/sc,dy=(e.clientY-lvDrag.sy)/sc;
  if(Math.abs(dx)>3||Math.abs(dy)>3)lvDrag.moved=true;
  const phone=$('phone');
  const el=$('liveFab');if(!el)return;
  let nx=lvDrag.ox+dx,ny=lvDrag.oy+dy;
  nx=Math.max(4,Math.min(nx,phone.offsetWidth-el.offsetWidth-4));
  ny=Math.max(4,Math.min(ny,phone.offsetHeight-el.offsetHeight-84));
  el.style.left=nx+'px';el.style.top=ny+'px';el.style.right='auto';el.style.bottom='auto';
  live.x=nx;live.y=ny;
}
function lvDragEnd(){lvDrag.on=false}

/* ============ 多端适配缩放 ============ */
function fitScale(w,h){return Math.min(1,(h-24)/850,(w-24)/392)}
function fitPhone(){
  const p=$('phone');if(!p)return;
  if(window.innerWidth<=500){p.style.transform='';window.__phoneScale=1;return}
  const s=fitScale(window.innerWidth,window.innerHeight);
  window.__phoneScale=s;
  if(s<1){p.style.transformOrigin='center center';p.style.transform='scale('+s+')'}
  else p.style.transform='';
}

  Object.keys(cost).forEach(k=>{w.attr[k]=Math.max(0,w.attr[k]-cost[k])});
  Object.keys(gain).forEach(k=>{w.attr[k]=Math.min(9999,w.attr[k]+gain[k])});
  if(extra)extra();
  save();renderWorld();
}

function doVenue(type,id){
  const v=WVENUES[type].items.find(x=>x.id===id);
  const lack=canPay(v.cost);
  if(lack.length){toast(lack.map(k=>WNAMES[k]).join('、')+'不足，先喂食/休息恢复');return}
  if(S.world.coinA<v.coin){toast('金币A不足，先去打工赚钱');return}
  openModal('<div style="text-align:center"><div style="font-size:38px">'+v.ic+'</div><div style="font-size:15.5px;font-weight:900;margin-top:6px">进入「'+v.n+'」</div>'+
  '<div style="font-size:11.5px;color:var(--sub);margin:10px 0;line-height:1.8">'+v.d+'<br>消耗：'+attrDeltaStr(neg(v.cost))+' · 金币A-'+v.coin+'<br>收益：'+attrDeltaStr(v.gain)+(v.crg?' · 勇气值+'+v.crg:'')+'</div>'+
  '<div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="closeModal()">再想想</button><button class="btn" onclick="closeModal();settleVenue(\''+type+'\',\''+v.id+'\')">确认进入</button></div></div>');
}
function settleVenue(type,id){
  const v=WVENUES[type].items.find(x=>x.id===id);const w=worldPet();
  S.world.coinA-=v.coin;
  if(v.crg)w.courage=Math.min(100,w.courage+v.crg);
  w.venue=(w.venue||0)+1;
  payAndGain(v.cost,v.gain);
  toast(v.n+'结束：'+attrDeltaTxt(v.gain)+(v.crg?' · 勇气值+'+v.crg:''));
}

/* 世界六维属性增减（0-100 / 成长·智慧 9999 封顶，HUD 联动） */
function w3dGain(o){
  const w=worldPet();

    w.attr[k]=Math.max(0,Math.min(cap,(w.attr[k]||0)+o[k]));

/* 手动互动：抚摸/喂食/玩耍/洗澡（单按钮 3s 冷却，全部作用于世界六维属性） */
function w3dAct(act){
  const now=Date.now();
  window._w3dCd=window._w3dCd||{};
  if(now-(window._w3dCd[act]||0)<3000){w3dMsg('冷却中，稍等一下再试');return}
  const p=curPet(),w=worldPet(),g=petGarden(p);
  if(act==='play'&&w.attr.stamina<12){w3dMsg(p.name+'累了，趴下来休息一会儿吧');return}
  window._w3dCd[act]=now;
  document.querySelectorAll('.w3d-act').forEach(function(b){if(b.dataset&&b.dataset.act===act){b.classList.add('cd');setTimeout(function(){b.classList.remove('cd')},3000)}});
  if(act==='touch'){
    w3dGain({mood:9});
    g.touchCount=(g.touchCount||0)+1;
    if(g.touchCount>=3&&g.tasks.touch!==today())g.tasks.touch=today();
    w3dFx('♥','#E8709A');w3dSay('好舒服呀～');w3dEmote('happy');
    w3dMsg('抚摸：'+p.name+'很开心，心情值+9');
  }else if(act==='feed'){
    w3dGain({hunger:18});addWorldGrowth(3,'喂食');
    if(g.tasks.feed!==today())g.tasks.feed=today();
    w3dFx('🐟','#E8945A');w3dSay('吧唧吧唧，真好吃！');w3dEmote('happy');
    w3dMsg('喂食成功：饥饿值+18，成长值+3');
  }else if(act==='play'){
    w3dGain({mood:7,stamina:-10,hunger:-6});
    w3dFx('✦','#5B8DEF');w3dEmote('play');
    w3dMsg('玩耍：心情+7 体力-10 饥饿-6');

}

/* 离线结算（世界版，替换原家园 settleGarden）：饥饿 -2/h 下限0、心情 -1/h 下限20；离开 >8h 弹「主人回来了」 */
function settleWorld(){
  if(!S||!S.world)return false;
  const now=Date.now();
  const last=S.world.lastLeave||now;
  S.world.lastLeave=now;
  const hrs=Math.min((now-last)/36e5,240);
  if(hrs<0.2){save();return false}
  const before={};
  S.pets.forEach(function(pp){const wp=worldPet(pp.id);before[pp.id]={h:wp.attr.hunger,m:wp.attr.mood};
    wp.attr.hunger=Math.max(0,wp.attr.hunger-hrs*2);
    wp.attr.mood=Math.max(20,wp.attr.mood-hrs*1);});
  save();
  if(hrs>8){showBackCard(before[S.curPet]||{h:0,m:0});return true}
  return false;
}
function showBackCard(before){

function w3dBuildScene(){
  const s=_w3d.scene;
  const amb=new THREE.AmbientLight(0xffffff,0.72);s.add(amb);_w3d.amb=amb;
  const sun=new THREE.DirectionalLight(0xfff2d9,0.95);sun.position.set(9,15,7);s.add(sun);_w3d.sun=sun;

  const grass=new THREE.Mesh(new THREE.CircleGeometry(34,48),new THREE.MeshLambertMaterial({color:0x7CBF6A}));
  grass.rotation.x=-Math.PI/2;s.add(grass);
  const inner=new THREE.Mesh(new THREE.CircleGeometry(12.6,40),new THREE.MeshLambertMaterial({color:0x8CCB78}));
  inner.rotation.x=-Math.PI/2;inner.position.y=0.01;s.add(inner);
  /* 篱笆（留出入口） */
  const fenceMat=new THREE.MeshLambertMaterial({color:0xB9906B});
  for(let i=0;i<26;i++){
    const a=i/26*Math.PI*2;
    if(a>Math.PI*0.42&&a<Math.PI*0.58)continue;
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.85,0.16),fenceMat);
    post.position.set(Math.cos(a)*12.6,0.42,Math.sin(a)*12.6);s.add(post);

  base.position.y=1.25;house.add(base);

  roof.rotation.y=Math.PI/4;roof.scale.set(1.18,1,1);roof.position.y=3.4;house.add(roof);
  const door=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.5,0.1),new THREE.MeshLambertMaterial({color:0x8A6238}));
  door.position.set(-0.6,0.75,1.72);house.add(door);
  const win=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.1),new THREE.MeshLambertMaterial({color:0xBEE3F8}));
  win.position.set(0.9,1.5,1.72);house.add(win);
  const eave=new THREE.Mesh(new THREE.BoxGeometry(4.4,0.12,1.5),new THREE.MeshLambertMaterial({color:0xB9906B}));
  eave.position.set(0,2.15,2.35);house.add(eave);
  house.position.set(5.6,0,-5.6);
  s.add(house);
  /* 建筑热点（低多边形建筑 + Canvas 纹理招牌） */

    const g=new THREE.Group();g.userData.tab=sp.tab;
    const b=new THREE.Mesh(new THREE.BoxGeometry(2.1,1.7,1.9),new THREE.MeshLambertMaterial({color:0xF5EFE2}));
    b.position.y=0.85;g.add(b);
    const rf=new THREE.Mesh(new THREE.ConeGeometry(1.7,1,4),new THREE.MeshLambertMaterial({color:sp.c}));
    rf.rotation.y=Math.PI/4;rf.position.y=2.2;g.add(rf);

    const tex=new THREE.CanvasTexture(cv);

    sign.position.set(0,1.15,0.98);g.add(sign);

  /* 秋季落叶粒子 */
  const leafN=90,lp=new Float32Array(leafN*3),lc=new Float32Array(leafN*3),spd=[];

/* 天空渐变 + 光照随天气切换（晴/阴/小雨） */
function w3dSetSky(kind){

  const c=cv.getContext('2d');const gr=c.createLinearGradient(0,0,0,128);
  if(kind==='sunny'){gr.addColorStop(0,'#3E7CD6');gr.addColorStop(0.6,'#8FC2F2');gr.addColorStop(1,'#E8F4FF')}

  else{gr.addColorStop(0,'#3A4A63');gr.addColorStop(0.7,'#6B7E97');gr.addColorStop(1,'#93A5B8')}
  c.fillStyle=gr;c.fillRect(0,0,4,128);

  if(_w3d.amb)_w3d.amb.intensity=kind==='sunny'?0.72:(kind==='overcast'?0.6:0.5);

function w3dDrawSign(rec){

/* 宠物模型：GLTF 加载（8s 超时 → 程序化兜底） */
function w3dLoadPet(){
  const p=curPet();const cfg=W3D_MODELS[p.species]||W3D_MODELS['猫'];
  _w3d.petId=S.curPet;
  let done=false;
  const to=setTimeout(function(){if(!done){done=true;w3dUseFallbackPet()}},8000);
  try{
    const loader=new THREE.GLTFLoader();
    loader.load(cfg.url,function(g){
      if(done)return;done=true;clearTimeout(to);
      const model=g.scene;
      /* 归一化到目标身高（源模型尺度不一），猫0.8/狗1.0 */
      const bb=new THREE.Box3().setFromObject(model);
      const hgt=Math.max(bb.max.y-bb.min.y,0.001);
      const targetH=(p.species==='鸟'||p.species==='异宠')?1.0:1.25;
      model.scale.setScalar(cfg.scale*targetH/hgt);
      const bb2=new THREE.Box3().setFromObject(model);
      const cx=(bb2.max.x+bb2.min.x)/2,cz=(bb2.max.z+bb2.min.z)/2;
      model.position.set(-cx,-bb2.min.y,-cz);
      w3dMountPet(model,g.animations||[]);
    },undefined,function(){if(!done){done=true;clearTimeout(to);w3dUseFallbackPet()}});
  }catch(e){if(!done){done=true;clearTimeout(to);w3dUseFallbackPet()}}
}
function w3dMountPet(model,clips){
  const grp=new THREE.Group();grp.userData.pet=true;
  grp.add(model);
  const blob=new THREE.Mesh(new THREE.CircleGeometry(0.75,24),new THREE.MeshBasicMaterial({color:0x1B3A22,transparent:true,opacity:0.22}));
  blob.rotation.x=-Math.PI/2;blob.position.y=0.02;grp.add(blob);
  _w3d.scene.add(grp);
  _w3d.pet=grp;_w3d.petInner=model;
  if(clips&&clips.length){
    _w3d.mixer=new THREE.AnimationMixer(model);
    const pick=function(re){return clips.find(function(c){return re.test(c.name)})};
    const idle=pick(/survey|idle/i)||clips[0],walk=pick(/walk/i)||idle,run=pick(/run|gallop|fly/i)||walk;
    _w3d.actions={idle:_w3d.mixer.clipAction(idle),walk:_w3d.mixer.clipAction(walk),run:_w3d.mixer.clipAction(run)};
    _w3d.actions.idle.play();_w3d.curAnim=_w3d.actions.idle;
  }
  if(_w3d.weather==='rain'){_w3d.ai.state='walkShelter';_w3d.ai.target=_w3d.shelter.clone()}
}
/* 程序化球体拼装兜底模型（动画手写） */
function w3dUseFallbackPet(){
  if(!_w3d)return;
  const grp=new THREE.Group();grp.userData.pet=true;
  const mat=new THREE.MeshLambertMaterial({color:0xE8A25C});
  const cream=new THREE.MeshLambertMaterial({color:0xFBE3C4});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.55,20,16),mat);
  body.scale.set(1,0.85,1.25);body.position.y=0.6;grp.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.36,20,16),mat);
  head.position.set(0,1.18,0.45);grp.add(head);
  const muz=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,10),cream);
  muz.position.set(0,1.1,0.74);grp.add(muz);
  const earL=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.3,6),mat);
  earL.position.set(-0.2,1.5,0.36);grp.add(earL);
  const earR=earL.clone();earR.position.x=0.2;grp.add(earR);
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,0.7,8),mat);
  tail.position.set(0,0.85,-0.72);tail.rotation.x=-0.9;grp.add(tail);
  const legs=[];
  [[-0.26,0.32],[0.26,0.32],[-0.26,-0.32],[0.26,-0.32]].forEach(function(l){
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.5,8),mat);
    leg.position.set(l[0],0.25,l[1]);grp.add(leg);legs.push(leg);
  });
  const blob=new THREE.Mesh(new THREE.CircleGeometry(0.75,24),new THREE.MeshBasicMaterial({color:0x1B3A22,transparent:true,opacity:0.22}));
  blob.rotation.x=-Math.PI/2;blob.position.y=0.02;grp.add(blob);
  _w3d.scene.add(grp);
  _w3d.pet=grp;_w3d.petInner=null;_w3d.mixer=null;_w3d.actions=null;
  _w3d.fbParts={body:body,head:head,tail:tail,legs:legs};
}
function w3dRemovePet(){
  if(!_w3d||!_w3d.pet)return;
  _w3d.scene.remove(_w3d.pet);
  _w3d.pet=null;_w3d.petInner=null;_w3d.mixer=null;_w3d.actions=null;_w3d.fbParts=null;
}
/* AnimationMixer 状态机（交叉淡入 0.3s） */
function w3dPlayAnim(name,ts){
  if(!_w3d||!_w3d.actions)return;
  const next=_w3d.actions[name]||_w3d.actions.idle;
  if(!next)return;
  if(_w3d.curAnim!==next){
    next.reset().fadeIn(0.3).play();
    if(_w3d.curAnim)_w3d.curAnim.fadeOut(0.3);
    _w3d.curAnim=next;
  }
  next.timeScale=ts||1;
}
/* 自主 AI：待机3–6s → 随机游走 → 原地玩耍 → 低体力趴睡 → 下雨躲檐；情绪映射：开心蹦跳/委屈慢走/困倦趴睡 */
function w3dAiTick(dt){
  const ai=_w3d.ai,pet=_w3d.pet;
  if(!pet)return;
  ai.t-=dt;
  const A=worldPet().attr;
  const upset=A.hunger<30||A.clean<30;
  const sleepy=A.stamina<25;
  const happy=A.mood>=70;
  if(_w3d.weather==='rain'&&ai.state!=='shelter'&&ai.state!=='walkShelter'){ai.state='walkShelter';ai.target=_w3d.shelter.clone()}
  if(ai.state==='idle'){
    pet.position.y=0;
    w3dPlayAnim('idle');
    if(ai.t<=0){
      if(sleepy){ai.state='sleep';ai.t=8+Math.random()*4}
      else if(_w3d.weather!=='rain'&&Math.random()<0.55){ai.state='walk';ai.target=w3dRandomPoint()}
      else{ai.state='play';ai.t=2.5+Math.random()*2}
    }
  }else if(ai.state==='walk'||ai.state==='walkShelter'){
    const sp=upset?0.9:(happy?2.6:1.7);
    w3dPlayAnim(sp>2.2?'run':'walk',upset?0.6:1);
    const dir=ai.target.clone().sub(pet.position);dir.y=0;
    const d=dir.length();
    if(d<0.3){
      if(ai.state==='walkShelter'){ai.state='shelter';ai.t=9999}
      else{ai.state='idle';ai.t=3+Math.random()*3}
    }else{
      dir.normalize();
      pet.position.addScaledVector(dir,sp*dt);
      pet.rotation.y=Math.atan2(dir.x,dir.z);
      const rr=Math.hypot(pet.position.x,pet.position.z);
      if(rr>11.5){pet.position.x*=11.5/rr;pet.position.z*=11.5/rr}
    }
  }else if(ai.state==='shelter'){
    pet.position.y=0;
    w3dPlayAnim('idle');
    if(_w3d.weather!=='rain'){ai.state='idle';ai.t=1.2}
  }else if(ai.state==='play'||ai.state==='jump'){
    w3dPlayAnim('idle');
    const k=ai.state==='jump'?7:(happy?6:4);
    const h=happy||ai.state==='jump'?0.34:0.18;
    pet.position.y=Math.abs(Math.sin(_w3d.clock.elapsedTime*k))*h;
    pet.rotation.y+=dt*(happy?2.2:1.1);
    if(ai.t<=0){pet.position.y=0;ai.state='idle';ai.t=3+Math.random()*3}
  }else if(ai.state==='sleep'){
    pet.position.y=0;
    w3dPlayAnim('idle',0.35);
    if(A.stamina<100){A.stamina=Math.min(100,A.stamina+3*dt);_w3d.hudDirty=true}
    if(A.stamina>55&&ai.t<=0){ai.state='idle';ai.t=2}
  }
  /* 兜底模型的手写动画 */
  if(_w3d.fbParts){
    const t=_w3d.clock.elapsedTime,fb=_w3d.fbParts;
    const walking=ai.state==='walk'||ai.state==='walkShelter';
    fb.body.position.y=0.6+Math.sin(t*3)*0.03;
    fb.head.position.y=1.18+(ai.state==='sleep'?-0.22:Math.sin(t*3)*0.04);
    fb.tail.rotation.z=Math.sin(t*(happy?8:3))*0.4;
    fb.legs.forEach(function(leg,i){leg.rotation.x=walking?Math.sin(t*10+(i%2?Math.PI:0))*0.5:0});
  }
}
function w3dRandomPoint(){
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2,r=2+Math.random()*7.5;
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(!W3D_SPOTS.some(function(s){return Math.hypot(x-s.x,z-s.z)<2.8}))return new THREE.Vector3(x,0,z);
  }
  return new THREE.Vector3(0,0,4);
}
/* 情绪气泡（Zzz / 委屈吐槽 / 躲雨） */
function w3dAutoBubble(){
  const st=_w3d.ai.state,A=worldPet().attr;
  if(st==='sleep')return '💤 Zzz…';
  if(st==='shelter'||st==='walkShelter')return '🌧 躲雨中…';
  const slot=Math.floor(_w3d.clock.elapsedTime/2.4);
  if(A.hunger<30)return ['肚子咕咕叫了…','想吃饭饭','饿了，没力气跑'][slot%3];
  if(A.clean<30)return ['身上痒痒的…','想洗个泡泡浴'][slot%2];
  return '';
}
function w3dBubbleTick(){
  const b=$('w3dBubble');if(!b||!_w3d.pet)return;
  const txt=_w3d.say||w3dAutoBubble();
  if(txt){
    b.textContent=txt;b.style.display='block';
    const v=_w3d.pet.position.clone();v.y+=2.1;v.project(_w3d.camera);
    b.style.left=((v.x*0.5+0.5)*_w3d.viewW)+'px';
    b.style.top=((-v.y*0.5+0.5)*_w3d.viewH-14)+'px';
  }else b.style.display='none';
}
/* 输入：拖动小角度环绕 / 滚轮·双指缩放 / 点按射线（点宠物=抚摸，点建筑=进面板） */
function w3dPtrDist(){
  const p=[..._w3d.ptrs.values()];
  if(p.length<2)return 0;
  return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
}
function w3dContentDelta(dx,dy){
  if(_w3d.rotated)return{du:dy,dv:-dx};
  return{du:dx,dv:dy};
}
function w3dNdc(e){
  const cx=window.innerWidth/2,cy=window.innerHeight/2;
  let lx,ly;
  if(_w3d.rotated){lx=_w3d.viewW/2+(e.clientY-cy);ly=_w3d.viewH/2-(e.clientX-cx)}
  else{lx=_w3d.viewW/2+(e.clientX-cx);ly=_w3d.viewH/2+(e.clientY-cy)}
  return new THREE.Vector2(lx/_w3d.viewW*2-1,-(ly/_w3d.viewH*2-1));
}
function w3dBindInput(){
  const el=_w3d.renderer.domElement;
  el.style.touchAction='none';
  el.addEventListener('pointerdown',function(e){
    _w3d.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    _w3d.moved=0;
    if(_w3d.ptrs.size===2)_w3d.pinch0=w3dPtrDist();
  });
  el.addEventListener('pointermove',function(e){
    if(!_w3d.ptrs.has(e.pointerId))return;
    const prev=_w3d.ptrs.get(e.pointerId);
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    _w3d.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    _w3d.moved+=Math.abs(dx)+Math.abs(dy);
    if(_w3d.ptrs.size===1){
      const d=w3dContentDelta(dx,dy);
      _w3d.cam.theta=Math.max(-0.5,Math.min(1.6,_w3d.cam.theta-d.du*0.004));
      _w3d.cam.phi=Math.max(0.55,Math.min(1.35,_w3d.cam.phi-d.dv*0.003));
    }else if(_w3d.ptrs.size===2){
      const d=w3dPtrDist();
      if(_w3d.pinch0)_w3d.cam.r=Math.max(8,Math.min(26,_w3d.cam.r*_w3d.pinch0/d));
      _w3d.pinch0=d;
    }
  });
  const up=function(e){
    const wasTap=_w3d.ptrs.size===1&&_w3d.moved<8;
    _w3d.ptrs.delete(e.pointerId);_w3d.pinch0=0;
    if(wasTap)w3dTap(e);
  };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',function(e){
    e.preventDefault();
    _w3d.cam.r=Math.max(8,Math.min(26,_w3d.cam.r*(1+(e.deltaY>0?0.08:-0.08))));
  },{passive:false});
}
function w3dTap(e){
  const n=w3dNdc(e);
  _w3d.ray.setFromCamera(n,_w3d.camera);
  if(_w3d.pet){
    const hit=_w3d.ray.intersectObject(_w3d.pet,true);
    if(hit.length){w3dAct('touch');return}
  }
  const hits=_w3d.ray.intersectObjects(_w3d.buildings,true);
  if(hits.length){
    let o=hits[0].object;
    while(o&&!o.userData.tab)o=o.parent;
    if(o)w3dOpenTab(o.userData.tab);
  }
}
/* 点击建筑：舞台挂起 → 系统面板；运动/娱乐 Lv.30 解锁 */
function w3dOpenTab(t){
  const locked=(t==='sport'||t==='fun')&&worldLevel()<WSPORT_UNLOCK_LV;
  if(locked){w3dMsg('成长等级 Lv.'+WSPORT_UNLOCK_LV+' 解锁（当前 Lv.'+worldLevel()+'）');return}
  w3dSuspend();go('world');openWTab(t);
}
/* HUD：顶部六维属性紧凑条 + 金币A + 世界等级 */
function w3dHudRefresh(){
  if(!_w3d)return;
  const A=worldPet().attr;
  const bars=[['hunger','🍖','#E8945A'],['clean','🫧','#3AB5C0'],['mood','💗','#E8709A'],['stamina','⚡','#5B8DEF'],['wisdom','📖','#8B5CF6'],['growth','🌱','#3BB786']];
  const el=$('w3dStats');
  if(el)el.innerHTML=bars.map(function(b){
    const v=b[0]==='growth'?Math.min(100,(A.growth%50)/50*100):Math.min(100,A[b[0]]);
    return '<div class="w3d-mini" title="'+WNAMES[b[0]]+'"><span>'+b[1]+'</span><div class="w3d-mbar"><i style="width:'+v+'%;background:'+b[2]+'"></i></div><b>'+Math.round(A[b[0]])+'</b></div>';
  }).join('');
  const coin=$('w3dCoin');
  if(coin)coin.textContent='🪙 '+S.world.coinA+' · Lv.'+worldLevel();
  _w3d.hudDirty=false;
  w3dSignRefresh();
}
/* 帧循环（requestAnimationFrame + delta） */
function w3dTick(){
  if(!_w3d||_w3d.suspended)return;
  const st=$('w3dStage');if(!st||!st.classList.contains('show'))return;
  const dt=Math.min(_w3d.clock.getDelta(),0.05);
  if(_w3d.mixer)_w3d.mixer.update(dt);
  /* 天气轮换 */
  _w3d.weatherT-=dt;
  if(_w3d.weatherT<=0)w3dWeather(false);
  /* 落叶粒子 */
  if(_w3d.leaves){
    const lp=_w3d.leaves.geometry.attributes.position;
    for(let i=0;i<_w3d.leafSpd.length;i++){
      let y=lp.getY(i)-_w3d.leafSpd[i]*dt;
      lp.setX(i,lp.getX(i)+Math.sin(_w3d.clock.elapsedTime+i)*dt*0.5);
      if(y<0){y=8+Math.random()*4;lp.setX(i,(Math.random()-0.5)*36);lp.setZ(i,(Math.random()-0.5)*36)}
      lp.setY(i,y);
    }
    lp.needsUpdate=true;
  }
  /* 雨粒子 */
  if(_w3d.rain&&_w3d.rain.visible){
    const rp=_w3d.rain.geometry.attributes.position;
    for(let i=0;i<_w3d.rainSpd.length;i++){
      let y=rp.getY(i)-_w3d.rainSpd[i]*dt;
      if(y<0)y=14+Math.random()*4;
      rp.setY(i,y);
    }
    rp.needsUpdate=true;
  }
  w3dAiTick(dt);
  /* 相机环绕 */
  const c=_w3d.cam;
  _w3d.camera.position.set(
    c.tx+c.r*Math.sin(c.phi)*Math.sin(c.theta),
    c.ty+c.r*Math.cos(c.phi),
    c.tz+c.r*Math.sin(c.phi)*Math.cos(c.theta));
  _w3d.camera.lookAt(c.tx,c.ty,c.tz);
  /* 气泡与吐槽 */
  if(_w3d.say&&_w3d.clock.elapsedTime>_w3d.sayUntil)_w3d.say='';
  _w3d.bubbleT-=dt;
  if(_w3d.bubbleT<=0){_w3d.bubbleT=0.25;w3dBubbleTick()}
  /* HUD（脏标记 + 2Hz 心跳） */
  _w3d.hudT-=dt;
  if(_w3d.hudDirty||_w3d.hudT<=0){_w3d.hudT=0.5;w3dHudRefresh()}
  _w3d.renderer.render(_w3d.scene,_w3d.camera);
}
/* ============ 启动 ============ */
function boot(){
  const d=new Date();const f=x=>String(x).padStart(2,'0');
  $('sbTime').textContent=f(d.getHours())+':'+f(d.getMinutes());
  setInterval(()=>{const n=new Date();$('sbTime').textContent=f(n.getHours())+':'+f(n.getMinutes())},30000);
  $('offlineBan').classList.toggle('show',S.set.offline);
  fitPhone();
  window.addEventListener('resize',fitPhone);
  document.addEventListener('pointermove',lvDragMove,{passive:true});
  document.addEventListener('pointerup',lvDragEnd);
  document.addEventListener('pointercancel',lvDragEnd);
  if(S.loggedIn&&!S.onboarded){$('onb').classList.add('show');onbShow()}
  if(S.loggedIn){go('home');liveOpen(false)}else go('login');
  if(S.loggedIn)setTimeout(settleWorld,800);
}
window.addEventListener('beforeunload',()=>{if(S&&S.world)S.world.lastLeave=Date.now();save()});
boot();
</script>
