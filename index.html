<div class="bg-blob" style="width:420px;height:420px;background:#8FB6EE;top:-120px;left:calc(50% - 520px)"></div>

<div class="phone" id="phone">
  <div class="statusbar"><span id="sbTime">9:41</span><span style="display:flex;gap:6px;align-items:center"><svg class="icon icon-s"><use href="#i-shield"/></svg><svg class="icon icon-s"><use href="#i-bell"/></svg></span></div>
  <div class="offlineBan" id="offlineBan"><svg class="icon icon-s"><use href="#i-alert"/></svg><span>网络连接不可用，部分功能暂不可用</span></div>

  <!-- 登录页 -->
  <section class="page" id="pg-login" style="padding-bottom:0">
    <div style="padding:46px 30px 20px;display:flex;flex-direction:column;height:100%">
      <div style="text-align:center;margin-bottom:34px" class="fadeUp">
        <div style="width:84px;height:84px;margin:0 auto 16px;border-radius:28px;background:linear-gradient(135deg,#6FA6F0,#3A7BD5);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 36px rgba(58,123,213,.4)">
          <svg class="icon" style="width:42px;height:42px;color:#fff"><use href="#i-paw"/></svg>
        </div>
        <div style="font-size:26px;font-weight:900;letter-spacing:1px">宠物数字管家</div>
        <div style="font-size:12px;color:var(--sub);margin-top:6px">真实宠物数字化 · AI 养宠顾问 · 线上情感陪伴</div>
      </div>
      <div class="card fadeUp" style="padding:22px 20px;animation-delay:.1s">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <span class="chip" style="padding:8px 13px;font-size:13px">+86</span>
          <input class="input" id="lgPhone" maxlength="11" inputmode="numeric" placeholder="请输入手机号" oninput="lgPhoneIn()">
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px" id="codeRow">
          <input class="input" id="lgCode" maxlength="6" inputmode="numeric" placeholder="请输入验证码">
          <button class="btn btn-sm btn-ghost" id="btnSend" style="white-space:nowrap" onclick="sendCode()">获取验证码</button>
        </div>
        <div style="font-size:11px;color:#A8B2BE;margin:2px 0 12px 4px" id="codeHint">验证码 5 分钟内有效 · 演示万能码 888888</div>
        <button class="btn" id="btnLogin" onclick="doLogin()">登录 / 注册</button>
        <div style="display:flex;align-items:center;gap:8px;margin:16px 0 12px">
          <div style="height:1px;flex:1;background:rgba(0,0,0,.07)"></div><span style="font-size:11px;color:#B4BDC8">其他方式</span><div style="height:1px;flex:1;background:rgba(0,0,0,.07)"></div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost" style="font-size:12.5px;padding:10px 0" onclick="guestLogin()"><svg class="icon icon-s"><use href="#i-user"/></svg>一键体验</button>
          <button class="btn btn-ghost" style="font-size:12.5px;padding:10px 0" onclick="toast('演示版：微信授权模拟')"><svg class="icon icon-s"><use href="#i-share"/></svg>微信登录</button>
        </div>
      </div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--sub);margin-top:18px;cursor:pointer">
        <input type="checkbox" id="lgAgree" style="margin-top:2px;accent-color:var(--blue-d)" checked>
        <span>已阅读并同意 <b style="color:var(--blue-d)">《用户协议》</b> 与 <b style="color:var(--blue-d)">《隐私政策》</b>，并同意隐私弹窗前置要求</span>
      </label>
      <div style="flex:1"></div>
      <div style="text-align:center;font-size:10.5px;color:#BCC5D0;padding-bottom:8px">宠物数字管家 · 正式版 V1.7.0</div>
    </div>
  </section>

  <!-- 主Tab页 -->
  <section class="page" id="pg-home"><div id="home-body" style="padding:14px 16px 0"></div></section>
  <section class="page" id="pg-ai" style="padding:0"><div id="ai-body" style="height:100%;display:flex;flex-direction:column"></div></section>
  <section class="page" id="pg-community"><div id="community-body" style="padding:12px 16px 0"></div></section>
  <section class="page" id="pg-me"><div id="me-body" style="padding:14px 16px 0"></div></section>

  <!-- 子页面 -->
  <section class="page" id="pg-profile" style="padding:0"><div id="profile-body"></div></section>
  <section class="page" id="pg-petedit" style="padding:0"><div id="petedit-body"></div></section>
  <section class="page" id="pg-health" style="padding:0"><div id="health-body"></div></section>
  <section class="page" id="pg-monitor" style="padding:0"><div id="monitor-body"></div></section>
  <section class="page" id="pg-mall"><div id="mall-body" style="padding:12px 16px 0"></div></section>
  <section class="page" id="pg-malldetail" style="padding:0"><div id="malldetail-body"></div></section>
  <section class="page" id="pg-cart" style="padding:0"><div id="cart-body"></div></section>
  <section class="page" id="pg-orders" style="padding:0"><div id="orders-body"></div></section>
  <section class="page" id="pg-messages"><div id="messages-body" style="padding:12px 16px 0"></div></section>
  <section class="page" id="pg-publish" style="padding:0"><div id="publish-body"></div></section>
  <section class="page" id="pg-travel"><div id="travel-body" style="padding:12px 16px 0"></div></section>
  <section class="page" id="pg-act"><div id="act-body" style="padding:12px 16px 0"></div></section>
  <section class="page" id="pg-points"><div id="points-body" style="padding:12px 16px 0"></div></section>
  <section class="page" id="pg-settings" style="padding:0"><div id="settings-body"></div></section>
  <!-- V1.7 虚拟人宠世界 -->
  <section class="page" id="pg-world" style="padding:12px 16px 0"><div id="world-body"></div></section>
  <!-- V1.7 进入游戏加载进度条 -->
  <div class="world-load" id="worldLoad">
    <div style="width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,#8FB6EE,#3A7BD5);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 44px rgba(58,123,213,.4);animation:wlBounce 1.2s ease-in-out infinite">
      <svg class="icon" style="width:46px;height:46px;color:#fff"><use href="#i-paw"/></svg>
    </div>
    <div style="font-size:17px;font-weight:900;margin-top:20px;letter-spacing:1px">虚拟人宠世界</div>
    <div id="wlTip" style="font-size:11.5px;color:var(--sub);margin-top:6px">正在载入「<span id="wlPetName"></span>」的小院…</div>
    <div class="wl-bar"><div class="wl-fill" id="wlFill"></div></div>
    <div id="wlPct" style="font-size:12px;font-weight:800;color:var(--blue-d);margin-top:6px">0%</div>
  </div>

  <nav class="tabbar hidden" id="tabbar">
    <button class="tbtn act" data-tab="home" onclick="tabTo('home')"><svg class="icon"><use href="#i-home"/></svg><span>首页</span></button>
    <button class="tbtn" onclick="openWorld()"><svg class="icon"><use href="#i-paw"/></svg><span>世界</span></button>
    <button class="ai-center" onclick="tabTo('ai')"><svg class="icon" style="width:26px;height:26px"><use href="#i-spark"/></svg></button>
    <button class="tbtn" data-tab="community" onclick="tabTo('community')"><svg class="icon"><use href="#i-compass"/></svg><span>社区</span></button>
    <button class="tbtn" data-tab="me" onclick="tabTo('me')"><svg class="icon"><use href="#i-user"/></svg><span>我的</span></button>
  </nav>

  <!-- 新手导览 -->
  <div class="onb" id="onb">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
      <div id="onbArt" style="width:150px;height:150px;border-radius:44px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8FB6EE,#3A7BD5);box-shadow:0 18px 44px rgba(58,123,213,.35);color:#fff">
        <svg style="width:70px;height:70px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><use href="#i-spark"/></svg>
      </div>
      <div id="onbT" style="font-size:24px;font-weight:900;margin-top:30px">AI 全场景养宠顾问</div>
      <div id="onbD" style="font-size:13.5px;color:var(--sub);margin-top:12px;line-height:1.7;max-width:260px">九大场景随问随答，档案上下文注入，回答贴合你家宠物的真实情况</div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:22px" id="onbDots">
      <span class="onb-dot act"></span><span class="onb-dot"></span><span class="onb-dot"></span>
    </div>
    <div style="display:flex;gap:12px">
      <button class="btn btn-ghost" onclick="finOnb()">跳过</button>
      <button class="btn" id="onbNext" onclick="onbNext()">下一步</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="mask" id="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"><div class="sheet-h" id="sheetTitle"></div><div class="sheet-b" id="sheetBody"></div></div>
  <div class="modal-wrap" id="modalWrap"><div class="modal" id="modalBox"></div></div>
</div>

<!-- V1.8 3D 宠物世界：横屏全屏舞台（脱离手机框，竖屏视口时内容旋转90°恒为横屏） -->
<div id="w3dStage">
  <div id="w3dBox">
    <div id="w3dGL"></div>
    <div id="w3dHudTop">
      <button id="w3dBack" onclick="w3dExit()">‹ 返回</button>
      <div id="w3dStats"></div>
      <div id="w3dCoin">🪙 0</div>
    </div>
    <div id="w3dTip">📱 旋转手机，横屏效果更佳</div>
    <div id="w3dBubble"></div>
    <div id="w3dFx"></div>
    <div id="w3dToast"></div>
    <div id="w3dFall">
      <div style="font-size:44px">🐾</div>
      <div style="font-size:17px;font-weight:900">3D 世界暂时进不去</div>
      <div class="w3d-fall-t" style="font-size:12px;opacity:.75;line-height:1.8">当前环境不支持 WebGL 或 3D 引擎未加载</div>
      <button class="btn" style="width:auto;padding:10px 26px" onclick="w3dExit()">返回首页</button>
    </div>
    <div id="w3dHudBottom">
      <button class="w3d-act" data-act="touch" onclick="w3dAct('touch')"><span>🤚</span>抚摸</button>
      <button class="w3d-act" data-act="feed" onclick="w3dAct('feed')"><span>🐟</span>喂食</button>
      <button class="w3d-act" data-act="play" onclick="w3dAct('play')"><span>🎾</span>玩耍</button>
      <button class="w3d-act" data-act="bath" onclick="w3dAct('bath')"><span>🛁</span>洗澡</button>
    </div>
  </div>
</div>
